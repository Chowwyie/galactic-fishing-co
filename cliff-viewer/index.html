<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hero Mesa #1 &mdash; Sunlit Shallows</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0a3a50;
background:linear-gradient(to bottom,#0d5a76 0%,#0a3a50 35%,#06222e 70%,#04141d 100%);}
#c{position:fixed;inset:0;}
#hud{position:fixed;left:12px;top:12px;color:#cfe8ef;font:13px/1.5 -apple-system,system-ui,sans-serif;
background:rgba(4,20,29,.55);padding:10px 12px;border-radius:10px;pointer-events:none;max-width:70vw;}
#hud b{color:#fff;}
#load{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#cfe8ef;
font:14px -apple-system,system-ui,sans-serif;background:rgba(4,20,29,.7);padding:12px 18px;border-radius:10px;}
</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="hud"><b>Hero Mesa #1</b> &middot; Sunlit Shallows &middot; fixed set<br>drag to orbit &middot; pinch/scroll to zoom &middot; two-finger drag to pan<br>552 verts &middot; authored in Blender, not procedural</div>
<div id="load">loading mesa&hellip;</div>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 400);
camera.position.set(26, 15, 26);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.7, 5.5, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.enableDamping = true;

const NOISE = `
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  float a=hash12(i), b=hash12(i+vec2(1,0)), c=hash12(i+vec2(0,1)), d=hash12(i+vec2(1,1));
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y); }
float fbm(vec2 p){ float v=0.0, a=0.5; for(int i=0;i<3;i++){ v+=a*vnoise(p); p*=2.03; a*=0.5; } return v; }
`;

const rockVert = `
varying vec3 vWN; varying vec3 vWP;
void main(){
  vWN = normalize(mat3(modelMatrix) * normal);
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vWP = wp.xyz;
  gl_Position = projectionMatrix * viewMatrix * wp;
}`;

const rockFrag = `
precision highp float;
uniform vec3 sunDir; uniform vec3 camPos; uniform float time;
varying vec3 vWN; varying vec3 vWP;
${NOISE}
void main(){
  vec3 N = normalize(vWN);
  float up = clamp(N.y, 0.0, 1.0);
  // two-tone: warm amber tops, cool teal-gray sides
  vec3 warm = vec3(1.00, 0.70, 0.40);
  vec3 cool = vec3(0.32, 0.52, 0.55);
  vec3 albedo = mix(cool, warm, smoothstep(0.12, 0.72, up));
  // large-scale mottling
  float m = fbm(vWP.xz*0.12 + vWP.y*0.07);
  albedo *= 0.82 + 0.36*m;
  // fine grain
  float g = hash12(vec2(vWP.x*3.7 + vWP.z*1.3, vWP.y*4.1));
  albedo *= 0.93 + 0.14*g;
  // sedimentary strata lines with wobble
  float wob = (fbm(vec2(vWP.x*0.25, vWP.z*0.25)) - 0.5) * 1.2;
  float s = fract((vWP.y + wob) / 2.4);
  float line = smoothstep(0.0, 0.05, s) * (1.0 - smoothstep(0.05, 0.13, s));
  albedo *= 1.0 - 0.28*line;
  // lit lip just above each line
  float lip = (1.0 - smoothstep(0.13, 0.30, s)) * smoothstep(0.05, 0.13, s);
  albedo += vec3(1.0, 0.78, 0.52) * 0.12 * lip * (0.3 + 0.7*up);
  // lighting: warm key + cool ambient
  float ndl = max(dot(N, sunDir), 0.0);
  vec3 col = albedo * (0.30 + 0.95*ndl);
  col += albedo * vec3(0.22, 0.42, 0.52) * (1.0 - up) * 0.45;
  col += vec3(1.0, 0.72, 0.42) * up * 0.28;
  // underwater fog + depth blue-shift
  float dist = distance(camPos, vWP);
  float f = 1.0 - exp(-dist * 0.011);
  vec3 fogCol = vec3(0.045, 0.21, 0.29);
  fogCol = mix(fogCol, vec3(0.015, 0.09, 0.15), clamp(-vWP.y*0.045, 0.0, 1.0));
  col = mix(col, fogCol, f);
  gl_FragColor = vec4(col, 1.0);
}`;

const sandFrag = `
precision highp float;
uniform vec3 sunDir; uniform vec3 camPos;
varying vec3 vWN; varying vec3 vWP;
${NOISE}
void main(){
  vec3 N = normalize(vWN);
  vec3 albedo = vec3(0.52, 0.47, 0.34);
  float m = fbm(vWP.xz*0.35);
  albedo *= 0.85 + 0.3*m;
  float g = hash12(vWP.xz*8.0);
  albedo *= 0.94 + 0.12*g;
  float ndl = max(dot(N, sunDir), 0.0);
  vec3 col = albedo * (0.35 + 0.8*ndl);
  col += albedo * vec3(0.25, 0.45, 0.55) * 0.3;
  float dist = distance(camPos, vWP);
  float f = 1.0 - exp(-dist * 0.011);
  vec3 fogCol = mix(vec3(0.045,0.21,0.29), vec3(0.015,0.09,0.15), clamp(-vWP.y*0.045,0.0,1.0));
  col = mix(col, fogCol, f);
  gl_FragColor = vec4(col, 1.0);
}`;

const rockUniforms = {
  sunDir: {value: new THREE.Vector3(0.45, 0.75, 0.35).normalize()},
  camPos: {value: camera.position},
  time: {value: 0},
};
const sandUniforms = {
  sunDir: {value: new THREE.Vector3(0.45, 0.75, 0.35).normalize()},
  camPos: {value: camera.position},
};

// sand disc to ground the mesa
const sand = new THREE.Mesh(
  new THREE.CircleGeometry(34, 48),
  new THREE.ShaderMaterial({uniforms: sandUniforms, vertexShader: rockVert, fragmentShader: sandFrag})
);
sand.rotation.x = -Math.PI/2;
sand.position.y = -0.6;
scene.add(sand);

new GLTFLoader().load('mesa1.glb', (gltf) => {
  document.getElementById('load').style.display = 'none';
  gltf.scene.traverse((o) => {
    if (o.isMesh) {
      // crisp facets: de-index + face normals
      let g = o.geometry.toNonIndexed();
      g.computeVertexNormals();
      o.geometry = g;
      o.material = new THREE.ShaderMaterial({
        uniforms: rockUniforms, vertexShader: rockVert, fragmentShader: rockFrag,
        side: THREE.DoubleSide,
      });
    }
  });
  scene.add(gltf.scene);
}, undefined, (err) => {
  document.getElementById('load').textContent = 'failed to load mesa1.glb';
  console.error(err);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
(function tick(){
  requestAnimationFrame(tick);
  rockUniforms.time.value = clock.getElapsedTime();
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
