const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,600);
camera.position.set(0,2,5);
const controls = new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,-45);
controls.enableDamping = true;
function rockMaterial(top,side,causticStrength){
return new THREE.ShaderMaterial({side:THREE.DoubleSide,uniforms:{
topColor:{value:new THREE.Color(top[0],top[1],top[2])},
sideColor:{value:new THREE.Color(side[0],side[1],side[2])},
causticStrength:{value:causticStrength},
fogColor:{value:new THREE.Color(0.09,0.30,0.48)},
fogDensity:{value:0.015},time:{value:0},
sunDir:{value:new THREE.Vector3(-0.089,-0.966,-0.243).normalize()},
sunColor:{value:new THREE.Color(0.9,0.97,1.0)},
ambColor:{value:new THREE.Color(0.2,0.45,0.65).multiplyScalar(0.6)}},
vertexShader:[
'varying vec3 vN;varying vec3 vW;',
'void main(){',
'vN=normalize(mat3(modelMatrix)*normal);',
'vec4 w=modelMatrix*vec4(position,1.0);vW=w.xyz;',
'gl_Position=projectionMatrix*viewMatrix*w;}'].join('\n'),
fragmentShader:[
'uniform vec3 topColor,sideColor,fogColor,sunColor,ambColor,sunDir;',
'uniform float causticStrength,fogDensity,time;',
'varying vec3 vN;varying vec3 vW;',
'float caustic(vec2 p,float t){',
'vec2 q=p*0.25;',
'float c=sin(q.x*3.1+t*0.7+sin(q.y*2.3-t*0.5));',
'c+=sin(q.y*2.7-t*0.6+sin(q.x*1.9+t*0.4));',
'return pow(c*0.25+0.5,3.0);}',
'void main(){',
'vec3 N=normalize(vN);',
'float up=clamp(N.y,0.0,1.0);',
'float down=clamp(-N.y,0.0,1.0);',
'float side=1.0-abs(N.y);',
'vec3 alb=mix(sideColor,topColor,smoothstep(0.2,0.7,up));',
'alb=mix(alb,sideColor*0.5,smoothstep(0.2,0.8,down));',
'float s=fract(vW.y/4.0);',
'float line=1.0-smoothstep(0.0,0.12,s);',
'float lip=smoothstep(0.10,0.28,s)*(1.0-smoothstep(0.28,0.55,s));',
'alb*=1.0-line*0.40*side;',
'alb=mix(alb,topColor*1.05,lip*0.30*side);',
'float tone=sin(vW.x*0.11+vW.z*0.13)*sin(vW.y*0.21+vW.x*0.05);',
'float grain=sin(vW.x*2.1+vW.y*1.3)*sin(vW.z*1.7-vW.y*2.3)*sin(vW.y*2.9+vW.x*0.7);',
'alb*=1.0+tone*0.08+grain*0.03;',
'float dif=max(dot(N,-sunDir),0.0);',
'vec3 col=alb*(ambColor+sunColor*dif);',
'float cmask=smoothstep(0.4,0.9,up)*exp(-max(30.0-vW.y,0.0)*0.015);',
'col+=vec3(0.85,0.95,1.0)*(caustic(vW.xz,time)*cmask*causticStrength);',
'float dist=distance(vW,cameraPosition);',
'float f=1.0-exp(-fogDensity*dist);',
'col=mix(col,fogColor,f);',
'gl_FragColor=vec4(col,1.0);}'].join('\n')});}
const rockMat=rockMaterial([0.96,0.80,0.58],[0.36,0.47,0.50],0.10);
const sandMat=rockMaterial([1.00,0.87,0.64],[0.55,0.62,0.55],0.20);

for(const m of MESHES){
let g;
if(m.box){
g=new THREE.BoxGeometry(m.box[0],m.box[1],m.box[2]);
}else{
g=new THREE.BufferGeometry();
g.setAttribute('position',new THREE.Float32BufferAttribute(m.v,3));
g.setAttribute('normal',new THREE.Float32BufferAttribute(m.n,3));
}
const mesh=new THREE.Mesh(g,m.sand?sandMat:rockMat);
mesh.position.set(m.p[0],m.p[1],m.p[2]);mesh.rotation.y=m.r;scene.add(mesh);}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{const t=clock.getElapsedTime();for(const m of mats)m.uniforms.time.value=t;controls.update();renderer.render(scene,camera);});
