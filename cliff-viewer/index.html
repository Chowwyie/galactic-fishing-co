<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hill #1 &mdash; Sunlit Shallows</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0a3a50;
background:linear-gradient(to bottom,#0d5a76 0%,#0a3a50 35%,#06222e 70%,#04141d 100%);}
#c{position:fixed;inset:0;}
#hud{position:fixed;left:12px;top:12px;color:#cfe8ef;font:13px/1.5 -apple-system,system-ui,sans-serif;
background:rgba(4,20,29,.55);padding:10px 12px;border-radius:10px;pointer-events:none;max-width:70vw;z-index:10;}
#hud b{color:#fff;}
#load{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#cfe8ef;
font:14px -apple-system,system-ui,sans-serif;background:rgba(4,20,29,.7);padding:12px 18px;border-radius:10px;z-index:10;}
#ab{position:fixed;right:12px;top:12px;display:flex;gap:8px;z-index:10;}
#ab button{font:13px -apple-system,system-ui,sans-serif;color:#cfe8ef;background:rgba(4,20,29,.55);
border:1px solid rgba(207,232,239,.35);border-radius:10px;padding:8px 14px;cursor:pointer;}
#ab button.on{background:rgba(38,120,150,.75);color:#fff;border-color:#7fd4e8;}
</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="hud"><b id="pieceName">Hill #1 &mdash; authored</b> &middot; Sunlit Shallows &middot; fixed set<br>drag to orbit &middot; pinch/scroll to zoom &middot; two-finger drag to pan<br><span id="pieceMeta">gentle slopes, flat shelves for vegetation &middot; no floor, drops into the depths</span></div>
<div id="ab"><button id="btnHill" class="on">Hill #1</button><button id="btnHill9">Hill v9</button><button id="btnMesa">Mesa #1</button></div>
<div id="load">loading hill&hellip;</div>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 2000);
camera.position.set(880, 440, 880);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 8, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.enableDamping = true;

const NOISE = `
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  float a=hash12(i), b=hash12(i+vec2(1,0)), c=hash12(i+vec2(0,1)), d=hash12(i+vec2(1,1));
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y); }
float fbm(vec2 p){ float v=0.0, a=0.5; for(int i=0;i<3;i++){ v+=a*vnoise(p); p*=2.03; a*=0.5; } return v; }
`;

const rockVert = `
varying vec3 vWN; varying vec3 vWP;
void main(){
  vWN = normalize(mat3(modelMatrix) * normal);
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vWP = wp.xyz;
  gl_Position = projectionMatrix * viewMatrix * wp;
}`;

const rockFrag = `
precision highp float;
uniform vec3 sunDir; uniform vec3 camPos; uniform float time; uniform float fogK;
varying vec3 vWN; varying vec3 vWP;
${NOISE}
void main(){
  vec3 N = normalize(vWN);
  float up = clamp(N.y, 0.0, 1.0);
  vec3 warm = vec3(1.00, 0.70, 0.40);
  vec3 cool = vec3(0.32, 0.52, 0.55);
  vec3 albedo = mix(cool, warm, smoothstep(0.12, 0.72, up));
  float m = fbm(vWP.xz*0.12 + vWP.y*0.07);
  albedo *= 0.82 + 0.36*m;
  float g = hash12(vec2(vWP.x*3.7 + vWP.z*1.3, vWP.y*4.1));
  albedo *= 0.93 + 0.14*g;
  float wob = (fbm(vec2(vWP.x*0.25, vWP.z*0.25)) - 0.5) * 1.2;
  float s = fract((vWP.y + wob) / 2.4);
  float line = smoothstep(0.0, 0.05, s) * (1.0 - smoothstep(0.05, 0.13, s));
  albedo *= 1.0 - 0.28*line;
  float lip = (1.0 - smoothstep(0.13, 0.30, s)) * smoothstep(0.05, 0.13, s);
  albedo += vec3(1.0, 0.78, 0.52) * 0.12 * lip * (0.3 + 0.7*up);
  float ndl = max(dot(N, sunDir), 0.0);
  vec3 col = albedo * (0.30 + 0.95*ndl);
  col += albedo * vec3(0.22, 0.42, 0.52) * (1.0 - up) * 0.45;
  col += vec3(1.0, 0.72, 0.42) * up * 0.28;
  float dist = distance(camPos, vWP);
  float f = 1.0 - exp(-dist * fogK);
  vec3 fogCol = vec3(0.045, 0.21, 0.29);
  fogCol = mix(fogCol, vec3(0.015, 0.09, 0.15), clamp(-vWP.y*0.045, 0.0, 1.0));
  col = mix(col, fogCol, f);
  gl_FragColor = vec4(col, 1.0);
}`;

// Hill shader: same rock language, but flat upward shelves read as pale
// sandy vegetation beds, and strata lines stay on the steeps.
const hillFrag = `
precision highp float;
uniform vec3 sunDir; uniform vec3 camPos; uniform float time; uniform float fogK;
varying vec3 vWN; varying vec3 vWP;
${NOISE}
void main(){
  vec3 N = normalize(vWN);
  float up = clamp(N.y, 0.0, 1.0);
  vec3 warm = vec3(1.00, 0.70, 0.40);
  vec3 cool = vec3(0.32, 0.52, 0.55);
  vec3 albedo = mix(cool, warm, smoothstep(0.12, 0.72, up));
  float m = fbm(vWP.xz*0.12 + vWP.y*0.07);
  albedo *= 0.82 + 0.36*m;
  float g = hash12(vec2(vWP.x*3.7 + vWP.z*1.3, vWP.y*4.1));
  albedo *= 0.93 + 0.14*g;
  float shelf = smoothstep(0.70, 0.90, up);
  vec3 sand = vec3(0.80, 0.74, 0.58) * (0.85 + 0.30*fbm(vWP.xz*0.22));
  albedo = mix(albedo, sand, shelf*0.92);
  float wob = (fbm(vec2(vWP.x*0.25, vWP.z*0.25)) - 0.5) * 1.2;
  float s = fract((vWP.y + wob) / 2.4);
  float line = smoothstep(0.0, 0.05, s) * (1.0 - smoothstep(0.05, 0.13, s));
  albedo *= 1.0 - 0.28*line*(1.0-shelf);
  float lip = (1.0 - smoothstep(0.13, 0.30, s)) * smoothstep(0.05, 0.13, s);
  albedo += vec3(1.0, 0.78, 0.52) * 0.12 * lip * (0.3 + 0.7*up) * (1.0-shelf);
  float ndl = max(dot(N, sunDir), 0.0);
  vec3 col = albedo * (0.30 + 0.95*ndl);
  col += albedo * vec3(0.22, 0.42, 0.52) * (1.0 - up) * 0.45;
  col += vec3(1.0, 0.72, 0.42) * up * 0.28;
  float dist = distance(camPos, vWP);
  float f = 1.0 - exp(-dist * fogK);
  vec3 fogCol = vec3(0.045, 0.21, 0.29);
  fogCol = mix(fogCol, vec3(0.015, 0.09, 0.15), clamp(-vWP.y*0.045, 0.0, 1.0));
  col = mix(col, fogCol, f);
  gl_FragColor = vec4(col, 1.0);
}`;

const rockUniforms = {
  sunDir: {value: new THREE.Vector3(0.45, 0.75, 0.35).normalize()},
  camPos: {value: camera.position},
  time: {value: 0},
  fogK: {value: 0.0035},
};

const hillGroup = new THREE.Group();
const hill9Group = new THREE.Group();
const mesaGroup = new THREE.Group();
hill9Group.visible = false;
mesaGroup.visible = false;
scene.add(hillGroup, hill9Group, mesaGroup);
let loaded = 0;
const done = () => { if (++loaded === 3) document.getElementById('load').style.display = 'none'; };

new GLTFLoader().load('hill1.glb', (gltf) => {
  gltf.scene.traverse((o) => {
    if (o.isMesh) {
      // keep Blender's smooth vertex normals for the gentle slopes
      o.material = new THREE.ShaderMaterial({
        uniforms: rockUniforms, vertexShader: rockVert, fragmentShader: hillFrag,
        side: THREE.DoubleSide,
      });
    }
  });
  hillGroup.add(gltf.scene);
  done();
}, undefined, (err) => {
  document.getElementById('load').textContent = 'failed to load hill1.glb';
  console.error(err);
});

new GLTFLoader().load('hill_v9.glb', (gltf) => {
  gltf.scene.traverse((o) => {
    if (o.isMesh) {
      o.material = new THREE.ShaderMaterial({
        uniforms: rockUniforms, vertexShader: rockVert, fragmentShader: hillFrag,
        side: THREE.DoubleSide,
      });
    }
  });
  hill9Group.add(gltf.scene);
  done();
}, undefined, (err) => {
  document.getElementById('load').textContent = 'failed to load hill_v9.glb';
  console.error(err);
});

new GLTFLoader().load('mesa1.glb', (gltf) => {
  gltf.scene.traverse((o) => {
    if (o.isMesh) {
      let g = o.geometry.toNonIndexed();
      g.computeVertexNormals();
      o.geometry = g;
      o.material = new THREE.ShaderMaterial({
        uniforms: rockUniforms, vertexShader: rockVert, fragmentShader: rockFrag,
        side: THREE.DoubleSide,
      });
    }
  });
  mesaGroup.add(gltf.scene);
  done();
}, undefined, (err) => {
  document.getElementById('load').textContent = 'failed to load mesa1.glb';
  console.error(err);
});

const btnH = document.getElementById('btnHill');
const btnH9 = document.getElementById('btnHill9');
const btnM = document.getElementById('btnMesa');
const pieceName = document.getElementById('pieceName');
const pieceMeta = document.getElementById('pieceMeta');
function show(which){
  const h = which === 'hill', h9 = which === 'hill9';
  rockUniforms.fogK.value = (h || h9) ? 0.0035 : 0.011;
  hillGroup.visible = h; hill9Group.visible = h9; mesaGroup.visible = !(h || h9);
  btnH.classList.toggle('on', h); btnH9.classList.toggle('on', h9); btnM.classList.toggle('on', !(h || h9));
  pieceName.textContent = h ? 'Hill #1 — authored' : h9 ? 'Hill v9 — extended Zone 1' : 'Hero Mesa #1 — authored';
  pieceMeta.textContent = h
    ? 'massive smooth slopes, slow descent · no floor, drops into the depths'
    : h9
    ? 'west entry hills + v8 center + hazy east hill · horizontal Zone 1'
    : '552 verts · authored in Blender, not procedural';
  if (h) { camera.position.set(880, 440, 880); controls.target.set(80, 0, 0); }
  else if (h9) { camera.position.set(0, 900, 2800); controls.target.set(0, 0, 0); }
  else   { camera.position.set(135, 75, 135); controls.target.set(0, 8, 0); }
}
btnH.onclick = () => show('hill');
btnH9.onclick = () => show('hill9');
btnM.onclick = () => show('mesa');

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
(function tick(){
  requestAnimationFrame(tick);
  rockUniforms.time.value = clock.getElapsedTime();
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
